<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>答岸 · 热门活动与翻书加载预览</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fa;--surface:#fff;--ink:#26394c;--muted:#738293;--blue:#2586c5;--blue-soft:#edf7fe;--line:#edf1f5;--price:#ac5d29}
    *{box-sizing:border-box}
    body{margin:0;background:#eef1f5;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    button{font:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #2685c5;outline-offset:4px}
    [hidden]{display:none!important}
    .preview{max-width:600px;margin:0 auto;padding:28px 12px 36px}
    .preview-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:0 8px 16px}
    .preview-header h1{font-size:16px;font-weight:600;margin:0}
    .preview-version{font-size:12px;color:#6e7d8e}
    .preview-controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 8px 22px}
    .preview-control{border:1px solid #d9e2eb;background:#fff;color:#3c5972;border-radius:18px;padding:8px 14px;min-height:40px;font-size:12px}
    .preview-control-primary{background:#e4f2fd;color:#217bb6;border-color:#c9e4f8}
    .phone{width:375px;max-width:100%;margin:auto;background:var(--bg);border-radius:24px;box-shadow:0 12px 42px #273b5110;padding:26px 20px 24px;min-height:480px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .section-heading h2{font-size:18px;font-weight:650;margin:0}
    .section-heading span{font-size:11px;color:#7d8c9c}
    .promo-list{display:grid;gap:16px}
    .promo{display:block;width:100%;appearance:none;border:0;padding:16px;border-radius:17px;background:var(--surface);color:var(--ink);text-align:left;box-shadow:0 4px 18px #25455f09}
    .promo-top{display:flex;gap:14px;align-items:center}
    .promo-image{width:88px;height:100px;flex-shrink:0;border-radius:11px;background:#f0f6fa;overflow:hidden;display:grid;place-items:center;color:#6c92ae}
    .promo-image img{width:100%;height:100%;object-fit:contain;display:block}
    .promo-image span{padding:10px;font-size:14px;text-align:center;font-weight:600}
    .promo-copy{flex:1;min-width:0}
    .tag{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;line-height:1.5;color:var(--blue);background:var(--blue-soft)}
    .promo h3{margin:7px 0 0;font-size:16px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
    .promo p{margin:5px 0 0;font-size:12px;line-height:1.65;color:var(--muted);overflow-wrap:anywhere}
    .promo-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px;padding-top:12px;border-top:1px solid var(--line)}
    .price{display:flex;align-items:baseline;gap:3px;color:var(--price);white-space:nowrap}
    .price-symbol{font-size:14px;font-weight:500}
    .price-value{font-size:27px;line-height:1.2;font-weight:650;letter-spacing:-.5px}
    .price-unit{font-size:12px;color:var(--muted)}
    .old-price{margin-left:9px;font-size:11px;color:#97a2ae}
    .promo-action{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:12px;min-height:30px;white-space:nowrap}
    .chevron{width:6px;height:6px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg)}
    .book-wait{height:385px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
    .book{width:108px;height:72px;position:relative;perspective:460px;transform:rotate(-5deg);--speed:1.65s}
    .book-shadow{position:absolute;width:100px;height:10px;left:4px;bottom:-12px;border-radius:50%;background:#1945681c;filter:blur(5px)}
    .cover{position:absolute;top:7px;width:54px;height:66px;background:#39a5e9}
    .cover-left{left:0;border-radius:8px 2px 2px 8px;transform:skewY(6deg)}
    .cover-right{right:0;border-radius:2px 8px 8px 2px;transform:skewY(-6deg)}
    .paper{position:absolute;top:6px;width:47px;height:58px;background:#fffdf5;box-shadow:0 2px #d8e6ee,0 4px #fffdf5;overflow:hidden}
    .paper-left{left:5px;border-radius:6px 0 0 6px;transform:skewY(6deg)}
    .paper-right{right:5px;border-radius:0 6px 6px 0;transform:skewY(-6deg)}
    .paper:after,.leaf:after{content:"";position:absolute;inset:15px 9px 13px;background:repeating-linear-gradient(to bottom,#d8e6ee 0 2px,transparent 2px 9px);opacity:.7}
    .leaf{position:absolute;width:47px;height:57px;top:6px;left:54px;transform-origin:left center;transform-style:preserve-3d;background:#fffdf5;border-radius:0 6px 6px 0;animation:page-turn var(--speed) ease-in-out infinite;box-shadow:1px 1px 2px #1945681c}
    .leaf-a{animation-delay:-1.1s}.leaf-b{animation-delay:-.55s}.leaf-c{animation-delay:0s}
    .spine{position:absolute;left:52px;top:9px;width:3px;height:57px;border-radius:50%;background:#d8e6ee;opacity:.7}
    .loading-copy{font-size:13px;letter-spacing:1px;color:var(--muted)}
    @keyframes page-turn{0%{transform:rotateY(0deg) skewY(-6deg);opacity:0}8%{opacity:1}60%{transform:rotateY(-178deg) skewY(-6deg);opacity:1}80%,100%{transform:rotateY(-180deg) skewY(-6deg);opacity:0}}
    .preview-note{font-size:12px;color:#768596;text-align:center;line-height:1.8;margin:18px 8px 0}
    .preview-status{min-height:22px;color:#5d7e97;font-size:12px;text-align:center;margin-top:14px}
    .modal{position:fixed;inset:0;z-index:10;background:#18283a6b;display:grid;place-items:center;padding:20px}
    .dialog{width:335px;max-width:100%;padding:24px;background:#fff;border-radius:20px;box-shadow:0 16px 60px #0c1d3b1f}
    .dialog h2{margin:0;font-size:18px;line-height:1.5}
    .dialog p{color:var(--muted);font-size:13px;line-height:1.8}
    .dialog .dialog-caption{font-size:11px;color:#8996a4}
    .dialog-close{border:0;border-radius:12px;width:100%;padding:12px;background:var(--blue-soft);color:var(--blue);margin-top:10px}
    @media(max-width:360px){.preview{padding-inline:8px}.phone{padding:24px 16px}.promo{padding:14px}.promo-image{width:76px;height:92px}.promo-top{gap:11px}.promo h3{font-size:15px}.price-value{font-size:25px}.promo-footer{gap:8px}}
    @media(prefers-reduced-motion:reduce){.leaf{animation:none;display:none}}
  </style>
</head>
<body>
  <main class="preview">
    <header class="preview-header"><h1>首页局部预览</h1><span class="preview-version">v2026.10.25.1</span></header>
    <div class="preview-controls" aria-label="预览加载状态">
      <button class="preview-control preview-control-primary" type="button" id="slow-load">看翻书加载</button>
      <button class="preview-control" type="button" id="fast-load">模拟快速加载</button>
      <button class="preview-control" type="button" id="show-activities">直接看活动</button>
    </div>
    <section class="phone" aria-label="首页热门活动">
      <header class="section-heading"><h2>热门活动</h2><span>答岸 · 自习时光</span></header>
      <div class="book-wait" id="book-wait" hidden role="status" aria-label="正在加载活动">
        <div class="book" aria-hidden="true"><div class="book-shadow"></div><div class="cover cover-left"></div><div class="cover cover-right"></div><div class="paper paper-left"></div><div class="paper paper-right"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div><div class="leaf leaf-c"></div><div class="spine"></div></div>
        <div class="loading-copy">正在翻开好时光…</div>
      </div>
      <div class="promo-list" id="promo-list">
        <button class="promo" type="button" data-promo="visit">
          <div class="promo-top">
            <div class="promo-image"><img src="https://api.dayousuoan.top/upload/swiper/1791553592990_b36c128a8cda4774a94b800ee48a3e77.jpg" alt="参观券活动原配图"><span hidden>答岸<br>参观券</span></div>
            <div class="promo-copy"><span class="tag">可退款</span><h3>想先来看看？领张参观券</h3><p>不用预约，买完即可录脸进店；可抵卡费</p></div>
          </div>
          <div class="promo-footer"><div class="price"><span class="price-symbol">¥</span><strong class="price-value">2</strong><span class="price-unit">/人</span><s class="old-price">¥15</s></div><span class="promo-action">查看详情 <i class="chevron" aria-hidden="true"></i></span></div>
        </button>
        <button class="promo" type="button" data-promo="duo">
          <div class="promo-top">
            <div class="promo-image"><img src="https://api.dayousuoan.top/upload/appstatic/index/vipCard.png" alt="双人同行上岸卡活动原配图"><span hidden>答岸<br>双人同行</span></div>
            <div class="promo-copy"><span class="tag">2人团</span><h3>双人同行上岸卡</h3><p>两人同行 · 每人100天 沉浸自习</p></div>
          </div>
          <div class="promo-footer"><div class="price"><span class="price-symbol">¥</span><strong class="price-value">799</strong><span class="price-unit">/人</span></div><span class="promo-action">查看详情 <i class="chevron" aria-hidden="true"></i></span></div>
        </button>
      </div>
    </section>
    <div class="preview-status" id="preview-status" role="status" aria-live="polite"></div>
    <p class="preview-note">使用当前两条活动的文案、价格与原配图<br>仅预览本模块；此处不执行购买或修改线上内容</p>
  </main>
  <div class="modal" id="detail-modal" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description">
      <h2 id="dialog-title"></h2><p id="dialog-description"></p><p class="dialog-caption">实际小程序继续使用该活动原有详情入口。</p><button type="button" class="dialog-close" id="dialog-close">返回活动预览</button>
    </section>
  </div>
  <script>
    (() => {
      const loader = document.getElementById('book-wait');
      const list = document.getElementById('promo-list');
      const status = document.getElementById('preview-status');
      const modal = document.getElementById('detail-modal');
      const closeButton = document.getElementById('dialog-close');
      let revealTimer;
      let finishTimer;
      let opener;
      function finish() {
        clearTimeout(revealTimer); clearTimeout(finishTimer);
        loader.hidden = true; list.hidden = false;
        list.setAttribute('aria-busy','false');
      }
      function load(duration) {
        finish(); status.textContent = '';
        list.setAttribute('aria-busy','true');
        revealTimer = setTimeout(() => { loader.hidden = false; list.hidden = true; status.textContent = '正在加载活动'; },220);
        finishTimer = setTimeout(() => { finish(); status.textContent = duration < 220 ? '加载完成，直接展示内容' : '加载完成'; },duration);
      }
      document.getElementById('slow-load').addEventListener('click',() => load(2800));
      document.getElementById('fast-load').addEventListener('click',() => load(80));
      document.getElementById('show-activities').addEventListener('click',() => {finish();status.textContent='';});
      document.querySelectorAll('.promo-image img').forEach(img => img.addEventListener('error',() => {img.hidden=true;img.nextElementSibling.hidden=false;}));
      const details = {
        visit:{title:'想先来看看？领张参观券',description:'¥2/人 · 可退款。' + '不用预约，买完即可录脸进店；可抵卡费。'},
        duo:{title:'双人同行上岸卡',description:'¥799/人 · 2人团。两人同行 · 每人100天 沉浸自习。'}
      };
      document.querySelectorAll('[data-promo]').forEach(button => button.addEventListener('click',() => {
        const detail = details[button.dataset.promo]; opener=button;
        document.getElementById('dialog-title').textContent=detail.title;
        document.getElementById('dialog-description').textContent=detail.description;
        modal.hidden=false; closeButton.focus();
      }));
      function close() { modal.hidden=true; if(opener)opener.focus(); }
      closeButton.addEventListener('click',close);
      modal.addEventListener('click',event=>{if(event.target===modal)close();});
      document.addEventListener('keydown',event=>{
        if(modal.hidden)return;
        if(event.key==='Escape')close();
        if(event.key==='Tab'){event.preventDefault();closeButton.focus();}
      });
    })();
  </script>
</body>
</html>
